plugins { id 'application' }
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    implementation 'org.springframework.kafka:spring-kafka-test:4.0.1'
    implementation 'org.apache.kafka:kafka-clients:4.1.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.22'
}
dependencyLocking { lockAllConfigurations() }
application { mainClass = 'playground.sourcefailure.SourceFailureLab' }
tasks.named('run', JavaExec) {
    standardInput = System.in
    maxHeapSize = '1024m'
}
tasks.register('verifyLab', JavaExec) {
    group = 'verification'
    description = 'Zero-payload consumers when the source API fails or slows: head-of-line blocking, DLT, health-gated pause, lookup strategies and max.poll.interval.ms.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'verify'
    maxHeapSize = '1024m'
}
tasks.named('check') { dependsOn 'verifyLab' }
