plugins { id 'application' }
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    implementation 'org.springframework.kafka:spring-kafka-test:4.0.1'
    implementation 'org.apache.kafka:kafka-clients:4.1.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
    implementation 'com.zaxxer:HikariCP:7.0.2'
    implementation 'org.postgresql:postgresql:42.7.10'
    implementation 'io.zonky.test:embedded-postgres:2.2.2'
    implementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:18.4.0')
    runtimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.22'
}
dependencyLocking { lockAllConfigurations() }
application { mainClass = 'playground.saga.SagaLab' }
tasks.named('run', JavaExec) {
    standardInput = System.in
    maxHeapSize = '1024m'
}
tasks.register('verifyLab', JavaExec) {
    group = 'verification'
    description = 'Run the same saga as orchestration and as choreography on real Kafka and PostgreSQL and compare them.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'verify'
    maxHeapSize = '1024m'
}
tasks.named('check') { dependsOn 'verifyLab' }
