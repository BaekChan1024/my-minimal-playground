plugins { id 'application' }
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    implementation 'org.springframework.kafka:spring-kafka-test:4.0.1'
    implementation 'org.apache.kafka:kafka-clients:4.1.1'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.22'
}
dependencyLocking { lockAllConfigurations() }
application { mainClass = 'playground.kafka.TransactionVisibilityLab' }
tasks.named('run', JavaExec) {
    standardInput = System.in
    maxHeapSize = '768m'
}
tasks.register('verifyLab', JavaExec) {
    group = 'verification'
    description = 'Verify transaction visibility, abort boundaries and application re-sends with a real Kafka broker.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'verify'
    maxHeapSize = '768m'
}
tasks.named('check') { dependsOn 'verifyLab' }
