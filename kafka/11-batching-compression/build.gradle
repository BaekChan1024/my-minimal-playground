plugins { id 'application' }
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    implementation 'org.springframework.kafka:spring-kafka-test:4.0.1'
    implementation 'org.apache.kafka:kafka-clients:4.1.1'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.22'
}
dependencyLocking { lockAllConfigurations() }
application { mainClass = 'playground.kafka.BatchingLab' }
tasks.named('run', JavaExec) {
    standardInput = System.in
    maxHeapSize = '1024m'
}
tasks.register('verifyLab', JavaExec) {
    group = 'verification'
    description = 'Measure batching, gzip, and acknowledgement latency while verifying every record.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'verify'
    maxHeapSize = '1024m'
}
tasks.named('check') { dependsOn 'verifyLab' }
